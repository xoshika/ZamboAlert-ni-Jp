services:
  # ── ZamboAlert Node.js Backend Service ─────────────────────────────────────
  - type: web
    name: zamboalert-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GATEWAY_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  # ── ZamboAlert Web Dashboard (Static Site) ─────────────────────────────────
  - type: web
    name: zamboalert-web
    runtime: static
    rootDir: zamboalert-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: zamboalert-backend
          property: host
